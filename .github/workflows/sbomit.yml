name: Build Time Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build frontend
        run: python -m pip install build

      - name: Build
        run: python -m build
